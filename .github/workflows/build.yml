name: Build

on:
  pull_request:

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'CMakeLists.txt'
              - 'Makefile'
              - '.devcontainer/**'
              - 'scripts/**'
              - '.github/workflows/**'
              - 'images/input/**'

  # Lint del RTL. Rápido y sin Docker: instala Verilator desde apt sólo para
  # revisar sintaxis y estilo, no para simular.
  #
  # TODO(integrante 4) — quitar `continue-on-error` cuando T1.2 esté mergeada.
  # Hoy src/rtl/axi4_ram.v es sólo la lista de puertos con el cuerpo vacío, así
  # que -Wall reporta todas las entradas como no usadas. Una vez implementado el
  # módulo, el lint debe pasar limpio y este job debe poder bloquear el merge.
  lint:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Lint RTL
        run: verilator --lint-only -Wall src/rtl/axi4_ram.v

  build:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install Pillow numpy

      - name: Prepare simulation input (use existing image or generate one)
        run: python scripts/prepare_input.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          tags: systemc-tlm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and run simulation
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            systemc-tlm:ci \
            make run | tee sim.log

      - name: Convert RAW output → JPG
        run: python scripts/raw_to_jpg.py images/output/output.raw images/output/output.jpg --gray

      - name: Update README with live results
        run: python scripts/generate_results.py sim.log --readme README.md

      - name: Commit updated results to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/input/image.raw images/output/output.raw images/output/output.jpg README.md
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "ci: update simulation results"
            git push origin HEAD:${{ github.head_ref }}
          fi
